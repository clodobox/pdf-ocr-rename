ocr:
  input_directory: 'input'
  output_directory: 'processed'
  backup_directory: ''
  error_directory: 'error'  # Where files that fail OCR or renaming are moved
  on_success_delete: true
  force_ocr: true
  language: 'fra+eng+deu'
  image_dpi:  # Image resolution in DPI for OCR
  use_threads: True # Number of threads to use for parallel processing
  author: ''  # PDF author
  subject: ''  # PDF subject
  rotate_pages: true  # Automatic page rotation
  remove_background: false  # Background removal
  deskew: true  # Page deskewing
  oversample:   # Image oversampling for better OCR accuracy
  optimize:   # PDF optimization level (0-3)
  tesseract_thresholding: 'auto'  # Tesseract thresholding method (auto, otsu, adaptive-otsu, sauvola)
  tesseract_timeout: 180.0  # Maximum timeout for Tesseract in seconds
  rotate_pages_threshold: 2.0  # Confidence threshold for automatic page rotation
  pdfa_image_compression: 'auto'  # Image compression for PDF/A (auto, jpeg, lossless, none)
  progress_bar: false  # Progress bar display
  jbig2_lossy:  # Lossy JBIG2 compression, useful for reducing PDF size
  tesseract_oem:  # Tesseract engine mode (0-3), 3 is the default mode and the most accurate
  ocr_json_settings: {}
  poll_new_file_seconds: 5
  use_polling: true
  retries_loading_file: 5
  loglevel: 'INFO'
  patterns:
    - '*.pdf'
    - '*.PDF'

rename:
  pattern: '(?:P0|PO|SPO|RNWS|SGR|SSR) ?\d?-?\d{1,2}-\d{1,4}'  # Regex used to find identifiers in the OCR'd text (case-insensitive)
  separator: '_'  # Separator used to join multiple identifiers found in the same file
  max_filename_length: 150  # Maximum length (in characters) of the generated filename, including the extension
  duplicate_strategy: 'increment'  # What to do when the generated filename already exists: increment, overwrite, timestamp

autocorrect:
  # Regex used to parse a cleaned-up match into named groups: `(?P<name>...)`.
  # Every group referenced under `groups:` or in `output_format` must be named here.
  regex: '(?P<prefix>[A-Z]+)[-]?(?P<second_part>\d{1,2})[-]?(?P<last_part>\d{1,4})'

  # Whole-string replacements applied before parsing (e.g. to fix a misread prefix).
  # The first matching pattern wins; the rest are skipped.
  rules:
    - pattern: '^P0-'
      replacement: 'PO'
    - pattern: '^PQ-'
      replacement: 'PO'
    - pattern: '^RNW-'
      replacement: 'RNWS'
    - pattern: '^5P0-'
      replacement: 'SPO'
    - pattern: '^56R-'
      replacement: 'SGR'

  # Character confusions applied to every group, unless that group defines its own
  # character_mapping below (typical OCR misreads: letter that looks like a digit).
  default_character_mapping:
    'O': '0'
    'I': '1'
    'S': '5'
    'B': '8'
    'Z': '2'
    'G': '6'

  # Per-group post-processing, applied after `regex` parses the match. A group not
  # listed here is used as-is (no padding; default_character_mapping still applies).
  groups:
    second_part:
      zfill: 2  # pad to 2 digits, e.g. '3' -> '03'
      force_first_char:  # business rule: these series are always dated in the 2020s
        depends_on_group: 'prefix'
        when_value_in: ['PO', 'SPO', 'RNWS', 'SGR', 'SSR']
        value: '2'
    last_part:
      zfill: 4  # pad to 4 digits, e.g. '27' -> '0027'

  # Template rebuilt from the named groups above once each is corrected.
  output_format: '{prefix}-{second_part}-{last_part}'

logging:
  directory: 'log'
  filename: 'ocr.log'
  level: 'INFO'
  format: '%(asctime)s - %(levelname)s - %(message)s'
  mode: 'single'  # 'daily' pour un log par jour, 'single' pour un seul fichier log
  max_size: 10485760  # Taille maximale du fichier log en octets (10 MB ici)
  backup_count: 5  # Nombre de fichiers log à conserver
  retention_days: 30  # Supprimer les logs plus vieux que 30 jours